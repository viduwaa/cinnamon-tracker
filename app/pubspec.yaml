name: cinnamon_trace
description: "Cinnamon Trace — farm-to-export cinnamon batch traceability for Sri Lanka."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  intl: any
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

  # Offline-first persistence (WP2)
  drift: ^2.28.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.0
  # Sync engine + auth persistence (WP5)
  uuid: ^4.4.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  # Host-test only: lets tests load the native sqlite3 DLL from tool/.
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala.ttf
